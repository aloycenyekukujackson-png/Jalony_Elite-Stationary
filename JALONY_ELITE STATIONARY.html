<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jalony Elite Digital Services</title>
<meta name="theme-color" content="#071a3d">

<style>
:root{--bg:#f3f7fc;--card:#fff;--text:#0b1a33;--muted:#5b6b82;--navy:#071a3d;--blue:#0a64d8;--green:#2db23d;--red:#d93838;--line:#dde5f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme=dark]{--bg:#0b1426;--card:#132041;--text:#e8eefb;--muted:#9fb0cc;--line:#22345e}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
#wm{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;opacity:.07;pointer-events:none;z-index:0}
#wm svg{width:min(80vw,460px);height:auto}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px}
.top .ttl{flex:1;min-width:0}.top small{display:block;color:#9fd96b;font-weight:700;font-size:11px;letter-spacing:.5px}.top b{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{background:none;border:0;color:inherit;padding:6px;cursor:pointer;display:flex;border-radius:8px}
.ic:active{background:rgba(255,255,255,.12)}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,85vw);background:var(--card);z-index:20;transform:translateX(-105%);transition:transform .2s;box-shadow:2px 0 12px rgba(0,0,0,.2);display:flex;flex-direction:column}
#drawer.open{transform:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15;display:none}
#scrim.open{display:block}
.sbox{padding:12px;border-bottom:1px solid var(--line)}
.sbox input{margin:0}
#menuList{overflow:auto;flex:1}
.mi{display:flex;gap:12px;align-items:center;padding:12px 14px;border:0;background:none;width:100%;text-align:left;color:var(--text);cursor:pointer;font:inherit}
.mi.on{color:var(--blue);background:rgba(10,100,216,.08)}
main{position:relative;z-index:1;padding:14px 14px 40px;max-width:600px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.row{display:flex;gap:12px;align-items:center}
.tile{width:42px;height:42px;border-radius:12px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;font-weight:700}
.tile.g{background:var(--green)}.tile.n{background:var(--navy)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:14px;padding:12px;text-align:center}
.stat b{font-size:22px;display:block;color:var(--blue)}
.en{font-weight:700;display:block}
.sw{display:block;color:var(--muted);font-size:12px}
.muted{color:var(--muted);font-size:13px}
.btn{background:var(--green);color:#fff;border:0;border-radius:10px;padding:12px 14px;font-size:15px;font-weight:700;width:100%;cursor:pointer;display:flex;gap:8px;justify-content:center;align-items:center;text-decoration:none;font-family:inherit;margin-top:6px}
.btn.sm{width:auto;padding:8px 12px;margin-top:0}
.btn.alt{background:var(--navy)}.btn.red{background:var(--red)}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;margin:4px 0 10px;background:var(--card);color:var(--text);font-family:inherit}
label{font-size:13px;color:var(--muted);font-weight:600;display:block}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(10,100,216,.12);color:var(--blue)}
.chip{display:inline-block;margin:4px 4px 0 0;padding:4px 10px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--blue);text-decoration:none}
.qr{background:#fff;border-radius:12px;padding:10px;display:flex;justify-content:center;min-height:200px;align-items:center}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:30;max-width:92%}
h2{font-size:17px;margin:6px 0 10px}
.bcard{border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.bcard .mark{font-size:20px;letter-spacing:.5px}
.bcard .tag{font-size:11px;opacity:.9;text-align:right}
.bcard .lnum{font-size:22px;font-weight:800;letter-spacing:2px;text-align:center;margin:4px 0}
.bcard input{background:rgba(255,255,255,.18);color:inherit;border-color:rgba(255,255,255,.4)}
.bcard .qr{margin:12px 0}
p{font-size:14px;line-height:1.5;margin:6px 0}
@media print{.top,#drawer,#scrim,nav,.toast,.noprint,#wm{display:none!important}body{background:#fff}}
.noprint{}

/* ===== Premium look ===== */
body{background:var(--bg);overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 18% 22%,rgba(10,100,216,.28),transparent 42%),
             radial-gradient(circle at 82% 30%,rgba(45,178,61,.22),transparent 40%),
             radial-gradient(circle at 50% 90%,rgba(10,100,216,.20),transparent 45%);
  animation:drift 16s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);background-size:250% 250%;animation:sheen 9s linear infinite}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(4%,3%) scale(1.12)}}
@keyframes sheen{0%{background-position:150% 0}100%{background-position:-50% 0}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(2deg)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(45,178,61,.45)}70%{box-shadow:0 0 0 14px rgba(45,178,61,0)}}
#wm img{width:min(78vw,440px);height:auto;opacity:.10;filter:drop-shadow(0 20px 40px rgba(10,100,216,.35));animation:float 9s ease-in-out infinite}
.top{background:linear-gradient(100deg,#071a3d 0%,#0a3bd8 55%,#1a7a2a 100%);box-shadow:0 6px 20px rgba(7,26,61,.35)}
.card{background:rgba(255,255,255,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.7);box-shadow:0 10px 30px rgba(7,26,61,.10);animation:rise .5s ease both;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(7,26,61,.16)}
[data-theme=dark] .card{background:rgba(19,32,65,.78);border-color:rgba(255,255,255,.06)}
[data-theme=dark] body::before{background:radial-gradient(circle at 18% 22%,rgba(10,100,216,.35),transparent 42%),radial-gradient(circle at 82% 30%,rgba(45,178,61,.25),transparent 40%),radial-gradient(circle at 50% 90%,rgba(10,100,216,.25),transparent 45%)}
.btn{background:linear-gradient(135deg,#2db23d,#1a9a2c);box-shadow:0 8px 20px rgba(45,178,61,.35);transition:transform .15s,box-shadow .2s;animation:glow 2.6s ease-out infinite}
.btn.alt{background:linear-gradient(135deg,#0a3bd8,#071a3d);box-shadow:0 8px 20px rgba(10,59,216,.35);animation:none}
.btn.red{background:linear-gradient(135deg,#e53b3b,#b00020)}
.btn:active{transform:scale(.98)}
.tile{box-shadow:0 6px 14px rgba(10,100,216,.25)}
.stat{background:rgba(255,255,255,.78);backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(7,26,61,.10);animation:rise .5s ease both}
.stat b{background:linear-gradient(90deg,#0a64d8,#2db23d);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:26px}
#drawer{background:rgba(255,255,255,.92);backdrop-filter:blur(14px)}
[data-theme=dark] #drawer{background:rgba(11,20,38,.94)}
.mi{transition:background .2s,padding-left .2s}.mi:hover{padding-left:20px}
.chip{background:rgba(10,100,216,.06);transition:transform .15s}.chip:hover{transform:translateY(-1px)}
.toast{background:linear-gradient(100deg,#071a3d,#0a3bd8);box-shadow:0 10px 24px rgba(0,0,0,.3)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const TINT=["Individual / Mtu binafsi","Business / Biashara binafsi","Company / Kampuni","Partnership / Ubia","NGO / Taasisi isiyo ya kiserikali","Government / Taasisi ya serikali","Foreign / Mgeni"];
function dynHTML(id){
  id=Number(id);
  const num=(i,en,sw,v)=>`<label>${bi(en,sw)}</label><input id="${i}" type="number" min="1" inputmode="numeric" value="${v}">`;
  const sel=(i,en,sw,o)=>`<label>${bi(en,sw)}</label><select id="${i}">${o.map(x=>`<option>${x}</option>`).join("")}</select>`;
  const pages=num("d_pages","Number of pages","Idadi ya page","");
  let h="";
  if(id===1) h+=pages+num("d_copies","Copies","Nakala","1")+sel("d_color","Print type","Aina ya uchapishaji",["Black & White / Nyeusi na nyeupe","Colour / Rangi"])+sel("d_sides","Sides","Pande",["Single side / Upande mmoja","Double side / Pande mbili"]);
  if(id===2) h+=pages+num("d_copies","Copies","Nakala","1");
  if(id===3) h+=pages;
  if(id===5) h+=sel("d_tin","TIN type","Aina ya TIN",TINT);
  if(id===9) h+=sel("d_job","Job type","Kazi unayoomba",JOBS)+`<input id="d_jobo" maxlength="60" placeholder="If other, write job / Kama nyingine, andika kazi">`+sel("d_cvtype","CV type","Aina ya CV",["New CV / CV mpya","Update CV / Rekebisha CV"]);
  return h+`<label>${bi("Your location (area / region)","Sehemu ulipo (eneo / mkoa)")}</label><select id="d_loc"><option value="">Chagua eneo / Choose area</option>${AREAS.map(a=>`<option>${a}</option>`).join("")}</select><label>${bi("Delivery or pickup","Kuletewa au kuchukua")}</label><select id="d_deliv"><option>Pickup at shop / Chukua dukani</option><option>Delivery when ready / Tutakuletea ukiwa tayari</option></select>`;
}
function dynUpdate(){$("#dyn").innerHTML=dynHTML($("#f_svc").value)}
const gv=i=>{const e=document.getElementById(i);return e?e.value.trim():""};
function dynCheck(){
  const id=Number($("#f_svc").value);
  if([1,2,3].includes(id)&&!(Number(gv("d_pages"))>=1)) throw new Error("Weka idadi ya page / Enter number of pages");
  if(id===9&&gv("d_job")==="Other / Nyingine"&&!gv("d_jobo")) throw new Error("Andika kazi / Write the job");
  if(gv("d_loc").length<2) throw new Error("Weka sehemu ulipo / Enter your location");
}
function dynSummary(){
  const p=[];
  if(gv("d_pages")) p.push("Pages: "+gv("d_pages"));
  if(gv("d_copies")) p.push("Copies: "+gv("d_copies"));
  if(gv("d_color")) p.push(gv("d_color"));
  if(gv("d_sides")) p.push(gv("d_sides"));
  if(gv("d_job")) p.push("Job: "+(gv("d_job")==="Other / Nyingine"?gv("d_jobo"):gv("d_job")));
  if(gv("d_cvtype")) p.push(gv("d_cvtype"));
  if(gv("d_tin")) p.push("TIN: "+gv("d_tin"));
  if(gv("d_loc")) p.push("Location: "+gv("d_loc"));
  if(gv("d_deliv")) p.push(gv("d_deliv"));
  return p.join(" · ");
}

async function auth(){
  try{
    const name=$("#a_name").value.trim(), phone=normPhone($("#a_phone").value), pin=$("#a_pin").value;
    if(!phone) throw new Error("Invalid phone / Simu si sahihi");
    if(!/^\d{4}$/.test(pin)) throw new Error("PIN: tarakimu 4 / 4 digits");
    const users=store.get("je_users",{}), h=await hash(phone+":"+pin);
    if(users[phone]){if(users[phone].h!==h) throw new Error("PIN si sahihi / Wrong PIN")}
    else{
      if(name.length<2) throw new Error("Weka jina / Enter name");
      users[phone]={name,h,role:phone===CFG.ADMIN?"admin":"customer"};
      if(!store.set("je_users",users)) return;
    }
    user={phone,name:users[phone].name,role:users[phone].role};
    store.set("je_user",user);toast("Karibu / Welcome, "+user.name);go("home");
  }catch(e){toast(e.message)}
}
function logout(){user=null;store.set("je_user",null);toast("Umetoka / Logged out");go("home")}

function setStatus(id,st){
  try{
    if(!user||user.role!=="admin") throw new Error("Not authorized / Huna ruhusa");
    if(!STATUS.includes(st)) throw new Error("Invalid status");
    const list=orders(), o=list.find(x=>x.id===id);
    if(!o) throw new Error("Order not found");
    o.status=st; if(saveOrders(list)) toast("Status updated / Imebadilishwa");
  }catch(e){toast(e.message)}
}
